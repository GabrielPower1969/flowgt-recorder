[package]
name = "recorder-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure, platform-independent core of FlowGT Recorder: bitrate budget, ffmpeg command construction, device/encoder parsing, progress parsing, segments and recovery, settings schema, filename templates. No I/O except through injected strings and paths."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
