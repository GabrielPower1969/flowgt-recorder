# This workflow has never run: there is no GitHub remote yet (D14).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --workspace --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Integration (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/integration.sh
      - name: Integration (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pwsh scripts/integration.ps1
      - run: npx tauri build --debug
