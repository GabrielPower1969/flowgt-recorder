<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowGT Recorder — Microphone access</title>
    <style>
      :root {
        --ink: #0C1A14; --ink-2: #3A4A43; --muted: #67756D;
        --surface: #FFFFFF; --surface-2: #F7F9F8; --line: #E2E8E5;
        --accent: #00694B; --accent-bg: #EAF4F0; --signal: #00C26D; --danger: #A3261C;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #F7F9F8; --ink-2: #E2E8E5; --muted: #8A9992;
          --surface: #111815; --surface-2: #0B100E; --line: #25302B;
          --accent: #5BC79E; --accent-bg: #16241E; --danger: #E5796B;
        }
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("fonts/space-grotesk.woff2") format("woff2");
        font-weight: 600 700;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface-2);
        color: var(--ink);
        font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", Roboto, sans-serif;
      }
      .card {
        width: min(440px, calc(100vw - 48px));
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 32px;
        text-align: center;
      }
      .lockup { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 20px; }
      .lockup img { width: 25px; height: 25px; }
      .wordmark {
        font: 600 20px/1 "Space Grotesk", -apple-system, sans-serif;
        letter-spacing: -0.055em;
      }
      .wordmark .gt { font-weight: 700; letter-spacing: -0.07em; }
      .wordmark .dot { color: var(--signal); }
      h1 { font: 700 19px/1.3 "Space Grotesk", -apple-system, sans-serif; margin: 0 0 10px; letter-spacing: -0.025em; }
      p { color: var(--ink-2); margin: 0 0 18px; }
      #result {
        padding: 12px;
        border-radius: 8px;
        background: var(--accent-bg);
        color: var(--accent);
        font-weight: 600;
      }
      #result.err { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lockup">
        <img src="icons/logo.svg" alt="" />
        <span class="wordmark">Flow<span class="gt">GT</span><span class="dot">.</span></span>
      </div>
      <h1>Enable your microphone</h1>
      <p>
        Chrome will ask for microphone access — click <b>Allow</b>.<br />
        This is needed once, so recordings include your side of the conversation.
      </p>
      <div id="result">Waiting for permission…</div>
    </div>
    <script src="permission.js"></script>
  </body>
</html>
