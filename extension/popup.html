<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* FlowGT design tokens — docs/BRAND.md (flowgt-website) */
      :root {
        --ink: #0C1A14;
        --ink-2: #3A4A43;
        --muted: #67756D;
        --surface: #FFFFFF;
        --surface-2: #F7F9F8;
        --line: #E2E8E5;
        --accent: #00694B;
        --accent-bg: #EAF4F0;
        --signal: #00C26D;
        --warn: #8A5A00;
        --danger: #A3261C;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #F7F9F8;
          --ink-2: #E2E8E5;
          --muted: #8A9992;
          --surface: #111815;
          --surface-2: #0B100E;
          --line: #25302B;
          --accent: #5BC79E;
          --accent-bg: #16241E;
          --warn: #D4A24C;
          --danger: #E5796B;
        }
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("fonts/space-grotesk.woff2") format("woff2");
        font-weight: 600 700;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: var(--surface);
        color: var(--ink);
        font: 400 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", Roboto, sans-serif;
      }
      :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

      /* Header — FlowGT lockup (portal.html wordmark spec) */
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 14px;
      }
      header img { width: 21px; height: 21px; display: block; }
      .wordmark {
        font: 600 17px/1 "Space Grotesk", -apple-system, sans-serif;
        letter-spacing: -0.055em;
        color: var(--ink);
      }
      .wordmark .gt { font-weight: 700; letter-spacing: -0.07em; }
      .wordmark .dot { color: var(--signal); }
      .product {
        font: 500 12.5px/1 -apple-system, sans-serif;
        color: var(--muted);
        margin-left: auto;
        letter-spacing: 0.01em;
      }

      /* Status */
      #status {
        min-height: 20px;
        margin-bottom: 12px;
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #status.recording { color: var(--ink); }
      .rec-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }
      #timer { font-variant-numeric: tabular-nums; font-weight: 700; }
      #status.error { color: var(--danger); }

      /* Label input */
      input[type="text"] {
        width: 100%;
        min-height: 40px;
        padding: 8px 12px;
        margin-bottom: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 13.5px;
      }
      input[type="text"]::placeholder { color: var(--muted); }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-bg);
      }
      input[type="text"]:disabled { opacity: 0.6; }

      /* Primary action — signal green idle, danger red while recording */
      button.action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        padding: 9px 15px;
        border: 1px solid var(--signal);
        border-radius: 8px;
        background: var(--signal);
        color: #0C1A14;
        font: inherit;
        font-size: 14.5px;
        font-weight: 750;
        cursor: pointer;
      }
      button.action:hover:not(:disabled) { filter: brightness(0.94); }
      button.action:disabled {
        background: var(--line);
        border-color: var(--line);
        color: var(--muted);
        cursor: default;
      }
      button.action.recording {
        background: var(--danger);
        border-color: var(--danger);
        color: #FFFFFF;
      }

      /* Mic warning chip */
      #micWarn {
        display: none;
        margin-top: 12px;
        padding: 9px 12px;
        border-radius: 8px;
        background: var(--accent-bg);
        color: var(--warn);
        font-size: 12.5px;
        line-height: 1.5;
      }
      #micWarn a { color: var(--warn); font-weight: 600; text-decoration: underline; }

      /* Footer */
      footer {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
      kbd {
        font: 600 10.5px/1 -apple-system, sans-serif;
        padding: 3px 5px;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 5px;
        color: var(--ink-2);
        background: var(--surface-2);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/logo.svg" alt="" />
      <span class="wordmark">Flow<span class="gt">GT</span><span class="dot">.</span></span>
      <span class="product">Recorder</span>
    </header>

    <div id="status">Ready — records this tab + your mic</div>

    <input
      type="text"
      id="label"
      placeholder="Label — e.g. Iris_Datacom_R2 (optional)"
      spellcheck="false"
    />

    <button id="actionBtn" class="action">Start recording</button>

    <div id="micWarn">
      Microphone not enabled — only the other side will be recorded.
      <a href="#" id="grantMic">Enable microphone →</a>
    </div>

    <footer>
      <span id="account">…</span>
      <span><kbd id="shortcutHint">⌘⇧9</kbd></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
